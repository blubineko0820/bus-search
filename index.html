<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣公車模擬器 Gist 行車紀錄查詢器</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .input-group { margin-bottom: 10px; }
        .result-item { border: 1px solid #ccc; padding: 15px; margin-top: 10px; border-radius: 5px; background-color: #fafafa; }
        .result-item h3 { margin-top: 0; margin-bottom: 8px; color: #333; }
        .result-item a { color: #0056b3; text-decoration: none; font-weight: bold; }
        .result-item a:hover { text-decoration: underline; }
        .error-msg { color: #d8000c; background-color: #ffbaba; border: 1px solid #d8000c; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>行車紀錄查詢 v1.03</h2>
    
    <div class="input-group">
        <label>車號：</label>
        <!-- 增加 oninput 讓使用者輸入時即時轉大寫 -->
        <input type="text" id="carNumber" placeholder="請輸入車號" oninput="this.value = this.value.toUpperCase()">
    </div>
    <div class="input-group">
        <label>開始日期：</label>
        <input type="date" id="startDate">
    </div>
    <div class="input-group">
        <label>結束日期：</label>
        <input type="date" id="endDate">
    </div>
    
    <button onclick="searchGists()">查詢紀錄</button>

    <div id="results" style="margin-top: 20px;"></div>

    <script>
        const workerUrl = 'https://bus-gist-api.tpbus-eal-0079.workers.dev';

        async function searchGists() {
            // 1. 車號去除首尾空白並強制轉大寫
            const carNum = document.getElementById('carNumber').value.trim().toUpperCase();
            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '';

            // 檢查日期填寫
            if (!startInput || !endInput) {
                resultsDiv.innerHTML = '<div class="error-msg"><strong>錯誤：</strong>請選擇開始日期與結束日期。</div>';
                return;
            }

            const start = new Date(`${startInput}T00:00:00`);
            const end = new Date(`${endInput}T23:59:59`);

            resultsDiv.innerHTML = '正在查詢中，請稍候...';

            try {
                // 2. 存取 Worker API
                const response = await fetch(workerUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤狀態碼: ${response.status} (${response.statusText || 'API 請求失敗'})`);
                }
                
                const gists = await response.json();

                if (!Array.isArray(gists)) {
                    throw new Error(`回傳資料格式錯誤：${JSON.stringify(gists)}`);
                }

                let matchedResults = '';

                // 3. 搜尋並比對紀錄
                for (const gist of gists) {
                    const gistDate = new Date(gist.created_at);

                    if (gistDate >= start && gistDate <= end) {
                        if (gist.files && gist.files['Record.md']) {
                            const rawUrl = gist.files['Record.md'].raw_url;
                            const rawResponse = await fetch(rawUrl);
                            
                            if (!rawResponse.ok) continue;
                            
                            const content = await rawResponse.text();

                            // 比對時將檔案內容也轉為大寫，避免大小寫不符合而找不到
                            if (!carNum || content.toUpperCase().includes(carNum)) {
                                // 利用正規表達式抓取所有時間格式 (如 13:00:47)
                                const timeMatches = content.match(/\d{2}:\d{2}:\d{2}/g);
                                let timeRangeText = '';

                                if (timeMatches && timeMatches.length > 0) {
                                    const firstTime = timeMatches[0]; // 第一站時間
                                    const lastTime = timeMatches[timeMatches.length - 1]; // 最後一站時間
                                    timeRangeText = `(${firstTime} ~ ${lastTime})`;
                                } else {
                                    // 備用方案：若沒抓到表格時間則顯示 Gist 建立時間
                                    timeRangeText = `(${gistDate.toLocaleTimeString()})`;
                                }

                                const displayCarNum = carNum || '行車';

                                // 格式化日期為 YYYY/MM/DD (例如: 2026/10/11)
                                const year = gistDate.getFullYear();
                                const month = String(gistDate.getMonth() + 1).padStart(2, '0');
                                const day = String(gistDate.getDate()).padStart(2, '0');
                                const dateStr = `${year}/${month}/${day}`;

                                matchedResults += `
                                <div class="result-item">
                                    <h3>${displayCarNum} ${dateStr} 行車紀錄 ${timeRangeText}</h3>
                                    <a href="${gist.html_url}" target="_blank">點我查看連結</a>
                                </div>`;
                            }
                        }
                    }
                }

                resultsDiv.innerHTML = matchedResults || '查無該車號紀錄。';

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `
                    <div class="error-msg">
                        <strong>查詢失敗（錯誤訊息/代碼）：</strong><br>
                        <code>${error.message || error}</code>
                    </div>`;
            }
        }
    </script>
</body>
</html>
