<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gist 行車紀錄查詢器</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .input-group { margin-bottom: 10px; }
        .result-item { border: 1px solid #ccc; padding: 10px; margin-top: 10px; border-radius: 5px; }
        pre { background-color: #f4f4f4; padding: 10px; overflow-x: auto; }
        .error-msg { color: #d8000c; background-color: #ffbaba; border: 1px solid #d8000c; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>行車紀錄查詢</h2>
    
    <div class="input-group">
        <label>車號：</label>
        <input type="text" id="carNumber" placeholder="請輸入車號">
    </div>
    <div class="input-group">
        <label>開始日期：</label>
        <input type="date" id="startDate">
    </div>
    <div class="input-group">
        <label>結束日期：</label>
        <input type="date" id="endDate">
    </div>
    
    <button onclick="searchGists()">查詢紀錄</button>

    <div id="results" style="margin-top: 20px;"></div>

    <script>
        // ⚠️ 請確認這裡已替換成您實際的 Cloudflare Worker 網址
        const workerUrl = 'https://bus-gist-api.tpbus-eal-0079.workers.dev';

        async function searchGists() {
            const carNum = document.getElementById('carNumber').value.trim();
            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '';

            // 1. 檢查日期是否有填寫
            if (!startInput || !endInput) {
                resultsDiv.innerHTML = '<div class="error-msg"><strong>錯誤：</strong>請選擇開始日期與結束日期。</div>';
                return;
            }

            // 設定搜尋時間範圍為當天的 00:00:00 到 23:59:59 (完整涵蓋當天)
            const start = new Date(`${startInput}T00:00:00`);
            const end = new Date(`${endInput}T23:59:59`);

            resultsDiv.innerHTML = '正在查詢中，請稍候...';

            try {
                // 2. 存取 Worker API
                const response = await fetch(workerUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤狀態碼: ${response.status} (${response.statusText || 'API 請求失敗'})`);
                }
                
                const gists = await response.json();

                if (!Array.isArray(gists)) {
                    throw new Error(`回傳資料格式錯誤：${JSON.stringify(gists)}`);
                }

                let matchedResults = '';

                // 3. 搜尋並比對紀錄
                for (const gist of gists) {
                    const gistDate = new Date(gist.created_at);

                    if (gistDate >= start && gistDate <= end) {
                        if (gist.files && gist.files['Record.md']) {
                            const rawUrl = gist.files['Record.md'].raw_url;
                            const rawResponse = await fetch(rawUrl);
                            
                            if (!rawResponse.ok) continue;
                            
                            const content = await rawResponse.text();

                            if (!carNum || content.includes(carNum)) {
                                matchedResults += `
                                <div class="result-item">
                                    <h3>符合紀錄 (建立時間: ${gistDate.toLocaleString()})</h3>
                                    <a href="${gist.html_url}" target="_blank">🔗 在 GitHub 上查看原始 Gist</a>
                                    <pre>${content}</pre>
                                </div>`;
                            }
                        }
                    }
                }

                resultsDiv.innerHTML = matchedResults || '查無該車號紀錄。';

            } catch (error) {
                console.error(error);
                // 顯示錯誤訊息與錯誤碼在下方
                resultsDiv.innerHTML = `
                    <div class="error-msg">
                        <strong>查詢失敗（錯誤訊息/代碼）：</strong><br>
                        <code>${error.message || error}</code>
                    </div>`;
            }
        }
    </script>
</body>
</html>
