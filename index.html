<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gist 行車紀錄查詢器</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .input-group { margin-bottom: 10px; }
        .result-item { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        pre { background-color: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h2>行車紀錄查詢 (透過 Cloudflare Worker 代理)</h2>
    
    <div class="input-group">
        <label>車號：</label>
        <input type="text" id="carNumber" placeholder="輸入車號 (例: FAB-191)">
    </div>
    <div class="input-group">
        <label>開始時間：</label>
        <input type="datetime-local" id="startTime">
    </div>
    <div class="input-group">
        <label>結束時間：</label>
        <input type="datetime-local" id="endTime">
    </div>
    
    <button onclick="searchGists()">查詢紀錄</button>

    <div id="results" style="margin-top: 20px;"></div>

    <script>
        // ⚠️ 請在這裡填入您的 Cloudflare Worker 網址
        const workerUrl = 'https://bus-gist-api.tpbus-eal-0079.workers.dev';

        async function searchGists() {
            const carNum = document.getElementById('carNumber').value.trim();
            const startInput = document.getElementById('startTime').value;
            const endInput = document.getElementById('endTime').value;
            const resultsDiv = document.getElementById('results');
            
            if (!startInput || !endInput) {
                alert("請輸入完整的時間範圍");
                return;
            }

            const start = new Date(startInput);
            const end = new Date(endInput);
            resultsDiv.innerHTML = '正在透過 Worker 查詢中，請稍候...';

            try {
                // 1. 透過 Cloudflare Worker 取得 Gist 列表 (已在後台夾帶 Token，不受 60 次限制)
                const response = await fetch(workerUrl);
                if (!response.ok) throw new Error('Worker 請求失敗');

                    if (gistDate
